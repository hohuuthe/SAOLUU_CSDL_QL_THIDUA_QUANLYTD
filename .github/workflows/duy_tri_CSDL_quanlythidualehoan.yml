name: Duy tri CSDL QUAN LY THI DUA LE HOAN

on:
  schedule:
    # Chạy tự động mỗi giờ một lần
    - cron: '0 * * * *'
  workflow_dispatch: # Cho phép chạy thủ công

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      - name: Chay script cap nhat
        env:
          # Đọc thông tin từ GitHub Secrets đã thiết lập ở Bước 1
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cat << 'EOF' > update_script.js
          const { createClient } = require('@supabase/supabase-js');

          // Đọc thông số từ biến môi trường (Environment Variables)
          const supabaseUrl = process.env.SUPABASE_URL;
          const supabaseKey = process.env.SUPABASE_KEY;

          if (!supabaseUrl || !supabaseKey) {
            console.error('Lỗi: Thiếu thông số cấu hình SUPABASE_URL hoặc SUPABASE_KEY trong Secrets.');
            process.exit(1);
          }

          const supabase = createClient(supabaseUrl, supabaseKey);

          async function main() {
            console.log('--- Bắt đầu tiến trình cập nhật CSDL ---');
            try {
              const { data, error: fetchError } = await supabase
                .from('duytricsdl')
                .select('*')
                .limit(1);

              if (fetchError) {
                console.error('Lỗi khi truy vấn:', fetchError.message);
                process.exit(1);
              }

              if (!data || data.length === 0) {
                console.log('Chưa có dữ liệu, đang tạo dòng mới...');
                const { error: insertError } = await supabase
                  .from('duytricsdl')
                  .insert([{ so: 1 }]);
                
                if (insertError) {
                  console.error('Lỗi khi chèn dữ liệu:', insertError.message);
                  process.exit(1);
                }
                console.log('Đã tạo thành công dòng đầu tiên.');
              } else {
                const record = data[0];
                const newSo = parseInt(record.so || 0) + 1;
                
                const { error: updateError } = await supabase
                  .from('duytricsdl')
                  .update({ so: newSo })
                  .eq('id', record.id);

                if (updateError) {
                  console.error('Lỗi khi cập nhật:', updateError.message);
                  process.exit(1);
                }
                console.log(`Cập nhật thành công! Giá trị mới: ${newSo}`);
              }
            } catch (err) {
              console.error('Lỗi hệ thống:', err.message);
              process.exit(1);
            }
            console.log('--- Tiến trình hoàn tất ---');
          }

          main();
          EOF
          node update_script.js
