name: Duy tri CSDL QUAN LY THI DUA LE HOAN

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      - name: Chay script cap nhat
        env:
          DUYTRI_SUPABASE_URL: ${{ secrets.DUYTRI_SUPABASE_URL }}
          DUYTRI_SUPABASE_KEY: ${{ secrets.DUYTRI_SUPABASE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const supabase = createClient(process.env.DUYTRI_SUPABASE_URL, process.env.DUYTRI_SUPABASE_KEY);

          async function main() {
            try {
              const { data, error } = await supabase.from('duytricsdl').select('*').limit(1);
              if (error) throw error;

              if (!data || data.length === 0) {
                await supabase.from('duytricsdl').insert([{ so: 1 }]);
                console.log('Khoi tao thanh cong');
              } else {
                const record = data[0];
                await supabase.from('duytricsdl').update({ so: (parseInt(record.so) || 0) + 1 }).eq('id', record.id);
                console.log('Cap nhat thanh cong');
              }
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          }
          main();
          "
